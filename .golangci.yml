version: "2"

linters:
  default: none
  enable:
    - depguard
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
  settings:
    depguard:
      rules:
        # The domain is pure types and ports. It imports no driver, HTTP
        # server, process, adapter or wire contract.
        gateway-domain:
          files:
            - "**/internal/domain/**"
          deny:
            - pkg: "database/sql"
              desc: "internal/domain declares ports; persistence lives in infrastructure"
            - pkg: "github.com/jackc/pgx"
              desc: "internal/domain has no database driver"
            - pkg: "net/http"
              desc: "internal/domain has no HTTP server"
            - pkg: "github.com/gofiber"
              desc: "internal/domain has no HTTP framework"
            - pkg: "github.com/valyala/fasthttp"
              desc: "internal/domain has no HTTP framework"
            - pkg: "os"
              desc: "internal/domain reads no environment variable"
            - pkg: "os/exec"
              desc: "internal/domain is pure and runs no process"
            - pkg: "github.com/manovaspace/orbit-auth"
              desc: "internal/domain defines its own auth types; the proto belongs to the adapter"
            - pkg: "github.com/manovaspace/orbit-rate-limiting"
              desc: "internal/domain declares the limiter port; the library belongs to the adapter"
            - pkg: "github.com/manovaspace/orbit-api-gateway/internal/infrastructure"
              desc: "internal/domain must not depend on an adapter"
        # The application layer reaches the outside world only through the
        # domain ports it receives in Deps.
        gateway-application:
          files:
            - "**/internal/application/**"
          deny:
            - pkg: "database/sql"
              desc: "internal/application reaches storage through a domain port"
            - pkg: "github.com/jackc/pgx"
              desc: "internal/application reaches storage through a domain port"
            - pkg: "net/http"
              desc: "internal/application has no HTTP server"
            - pkg: "github.com/gofiber"
              desc: "internal/application has no HTTP framework"
            - pkg: "github.com/valyala/fasthttp"
              desc: "internal/application has no HTTP framework"
            - pkg: "os"
              desc: "internal/application reads no environment variable"
            - pkg: "os/exec"
              desc: "internal/application runs no process"
            - pkg: "github.com/manovaspace/orbit-auth"
              desc: "internal/application uses domain.AuthService; the proto belongs to the adapter"
            - pkg: "github.com/manovaspace/orbit-rate-limiting"
              desc: "internal/application uses domain.Limiter; the library belongs to the adapter"
            - pkg: "github.com/manovaspace/orbit-api-gateway/internal/infrastructure"
              desc: "internal/application must not depend on an adapter"
