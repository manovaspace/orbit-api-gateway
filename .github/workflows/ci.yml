# Go service / library CI — replace {{REPO}} as needed
# Actions pinned to full SHAs (OpenSSF Scorecard / supply-chain hygiene).
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: "1.26.x"
      - name: Checkout sibling replace modules
        run: |
          set -euo pipefail
          mapfile -t siblings < <(grep -E '=> \.\./orbit-' go.mod | sed -E 's/.*=> \.\.\/(orbit-[^ ]+).*/\1/' | sort -u || true)
          for name in "${siblings[@]:-}"; do
            [ -z "$name" ] && continue
            dest="../${name}"
            if [ ! -d "$dest/.git" ] && [ ! -f "$dest/go.mod" ]; then
              echo "Cloning ${name} -> ${dest}"
              git clone --depth 1 "https://github.com/manovaspace/${name}.git" "$dest"
            fi
          done
      - name: Test
        run: go test -race ./...
      - name: Vet
        run: go vet ./...
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
      - uses: golangci/golangci-lint-action@9fae48acfc02a90574d7c304a1758ef9895495fa # v7.0.1
        with:
          version: v2.1.6
