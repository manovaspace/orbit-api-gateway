      operationId: sessionSignInMethods
      summary: The caller's sign-in methods
      description: >
        Lists how the account of the bearer access token signs in: whether it has
        a password, its linked Google account and its contact identifiers. Optional
        strings are null when unset. The answer is never cacheable.
      responses:
        "200":
          description: Sign-in methods
          headers:
            Cache-Control:
              schema:
                type: string
                example: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignInMethods"
        "401":
          description: Missing or invalid access token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "429":
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "502":
          description: Upstream orbit-auth failure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /api/v1/session/password:
    put:
      operationId: sessionPasswordSet
      summary: Set or change the caller's password
      description: >
        Sets the password of the bearer access token's account. The current
        password is required only when the account already has one. The password
        change has a budget of 5 attempts per subject per 15 minutes, on top of the
        per-IP budget. A wrong current password is 403 with code
        `invalid_credentials`. `refresh_token` names the session to keep; the
        other sessions are not revoked by this call.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [new_password]
              properties:
                current_password:
                  type: string
                  writeOnly: true
                new_password:
                  type: string
                  writeOnly: true
                refresh_token:
                  type: string
                  writeOnly: true
      responses:
        "204":
          description: Password set
          headers:
            Cache-Control:
              schema:
                type: string
                example: no-store
        "400":
          description: Invalid request, `password_required`, `password_too_short` or `invalid_refresh`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: The current password is not correct (`invalid_credentials`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "409":
          description: The account has no verified email, mobile or username to sign in with (`no_password_identifier`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Missing or invalid access token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "429":
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "502":
          description: Upstream orbit-auth failure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /api/v1/session/google/link/start:
    post:
      operationId: sessionGoogleLinkStart
      summary: Start linking a Google account
      description: >
        Returns the Google authorization URL and the single-use state for linking a
        Google account to the bearer access token's account. The answer is never
        cacheable. When Google sign-in is off the edge answers 404.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                redirect_uri:
                  type: string
                return_to:
                  type: string
      responses:
        "200":
          description: Authorization URL and state issued
          headers:
            Cache-Control:
              schema:
                type: string
                example: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GoogleSignInStarted"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Google sign-in is off
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "409":
          description: Google is already linked to this account (`google_already_linked`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Missing or invalid access token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "429":
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "502":
          description: Upstream orbit-auth failure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /api/v1/session/google/link/complete:
    post:
      operationId: sessionGoogleLinkComplete
      summary: Complete linking a Google account
      description: >
        Exchanges the link state and the Google authorization code. It links the
        Google account and issues no tokens. The answer is never cacheable.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [state, code]
              properties:
                state:
                  type: string
                  writeOnly: true
                code:
                  type: string
                  writeOnly: true
      responses:
        "200":
          description: Google account linked
          headers:
            Cache-Control:
              schema:
                type: string
                example: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GoogleLinked"
        "400":
          description: The link attempt expired or failed (`state_expired`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Google sign-in is off
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "409":
          description: The Google account is linked to another account (`google_identity_taken`) or this account already has one (`google_already_linked`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Missing or invalid access token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "429":
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "502":
          description: Upstream orbit-auth failure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /api/v1/session/google:
    delete:
      operationId: sessionGoogleUnlink
      summary: Unlink the Google account
      description: >
        Removes the linked Google account of the bearer access token's account. The
        last sign-in method cannot be removed.
      responses:
        "204":
          description: Google account unlinked
          headers:
            Cache-Control:
              schema:
                type: string
                example: no-store
        "404":
          description: Google sign-in is off, or Google is not linked (`google_not_linked`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "409":
          description: It is the last sign-in method (`last_sign_in_method`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Missing or invalid access token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "429":
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "502":
          description: Upstream orbit-auth failure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /api/v1/session/revoke-all:
    post:
      operationId: sessionRevokeAll
      summary: Revoke the caller's sessions
      description: >
        Revokes every refresh token of the bearer access token's account. When
        `refresh_token` is given, that one session is kept.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                refresh_token:
                  type: string
                  writeOnly: true
      responses:
        "204":
          description: Sessions revoked
          headers:
            Cache-Control:
              schema:
                type: string
                example: no-store
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Missing or invalid access token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "429":
          description: Rate limit exceeded
          content:
            application/json:
