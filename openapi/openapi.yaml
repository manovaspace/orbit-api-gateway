openapi: 3.1.0
info:
  title: Orbit API Gateway
  version: 0.1.0
  description: |
    REST edge for Orbit Auth, organizations and invitations.

    Membership and invitation writes are authorized by Orbit Auth, not here.
    Every membership has an administration tier (owner, admin or member). The
    caller must be an active owner or admin; an admin can change only plain
    members; only an owner can grant owner or admin; any member can remove
    themselves. A caller without that authority gets 403, and the last active
    owner can never be removed, suspended or demoted (409). The tier is not a
    product role: products keep their own roles and permissions.
servers:
  - url: /
security:
  - bearerAuth: []
paths:
  /api/v1/auth/login:
    post:
      operationId: authLogin
      summary: Login with email or mobile number and password
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              oneOf:
                - required: [identifier]
                - required: [email]
              properties:
                identifier:
                  type: string
                  description: Email address or E.164 mobile number (for example +989121234567).
                email:
                  type: string
                  format: email
                  deprecated: true
                  description: Deprecated alias for identifier.
                password:
                  type: string
                  format: password
                  writeOnly: true
      responses:
        "200":
          description: Tokens issued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenPair"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "429":
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /api/v1/auth/otp/request:
    post:
      operationId: authOtpRequest
      summary: Request OTP
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [channel]
              properties:
                identifier:
                  type: string
                  description: Canonical identity (preferred). Falls back to email when empty.
                email:
                  type: string
                  format: email
                  description: Legacy alias used when identifier is omitted.
                channel:
                  type: string
                  enum: [email, sms]
                correlation_id:
                  type: string
      responses:
        "200":
          description: OTP dispatched
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OtpRequestResponse"
        "429":
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /api/v1/auth/otp/verify:
    post:
      operationId: authOtpVerify
      summary: Verify OTP
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [channel, code]
              properties:
                identifier:
                  type: string
                  description: Canonical identity (preferred). Falls back to email when empty.
                email:
                  type: string
                  format: email
                  description: Legacy alias used when identifier is omitted.
                channel:
                  type: string
                  enum: [email, sms]
                code:
                  type: string
      responses:
        "200":
          description: Tokens issued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenPair"
        "401":
          description: Invalid OTP
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "429":
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /api/v1/auth/token/refresh:
    post:
      operationId: authTokenRefresh
      summary: Refresh access token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token:
                  type: string
                  writeOnly: true
      responses:
        "200":
          description: Tokens issued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenPair"
        "401":
          description: Invalid refresh token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /api/v1/auth/token/revoke:
    post:
      operationId: authTokenRevoke
      summary: Revoke refresh token
      description: >
        Idempotent. Unknown, revoked, expired or empty refresh tokens also return 204,
        so the response never reveals whether a token was valid.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token:
                  type: string
                  writeOnly: true
      responses:
        "204":
          description: Token revoked, or already unknown, revoked or expired
        "400":
          description: Malformed JSON body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "429":
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          description: Upstream store failure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /api/v1/system/ownership/challenge:
    post:
      operationId: systemOwnershipChallenge
      summary: Initiate in-memory platform owner OTP (no email)
      description: >
        Stores a 6-digit code in gateway process memory for 10 minutes.
        Does not send SMTP or notification email. Status is `challenge_dispatched`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
                display_name:
                  type: string
      responses:
        "200":
          description: OTP challenge dispatched
          content:
            application/json:
              schema:
                type: object
                required: [status, expires_in]
                properties:
                  status:
                    type: string
                  expires_in:
                    type: string
        "429":
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /api/v1/system/ownership/verify:
    post:
      operationId: systemOwnershipVerify
      summary: Verify in-memory owner OTP
      description: >
        Checks the in-memory challenge. Does not persist an owner vault.
        `key_fingerprint` is a hash of email, code, and timestamp — not a signing secret.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, code]
              properties:
                email:
                  type: string
                  format: email
                code:
                  type: string
      responses:
        "200":
          description: Owner verified
          content:
            application/json:
              schema:
                type: object
                required: [status, email, key_fingerprint, verified_at]
                properties:
                  status:
                    type: string
                  email:
                    type: string
                  key_fingerprint:
                    type: string
                  verified_at:
                    type: string
                    format: date-time
        "401":
          description: Invalid OTP
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /api/v1/dev/onboard/claim:
    post:
      operationId: devOnboardClaim
      summary: Claim developer onboarding invite and receive credentials (Canonical)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [invite_token, desired_uid]
              properties:
                invite_token:
                  type: string
                desired_uid:
                  type: string
                email:
                  type: string
                  format: email
                display_name:
                  type: string
                ssh_public_key:
                  type: string
      responses:
        "200":
          description: Developer account provisioned
          content:
            application/json:
              schema:
                type: object
                required: [status, user, credentials, workspace]
                properties:
                  status:
                    type: string
                  idempotent_replay:
                    type: boolean
                  user:
                    type: object
                  credentials:
                    type: object
                  workspace:
                    type: object
        "400":
          description: Invalid claim request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /api/v1/admin/challenge:
    post:
      operationId: adminChallenge
      summary: Alias for in-memory owner OTP (no email)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
                display_name:
                  type: string
      responses:
        "200":
          description: OTP challenge dispatched
          content:
            application/json:
              schema:
                type: object
                required: [status, expires_in]
                properties:
                  status:
                    type: string
                  expires_in:
                    type: string
        "429":
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /api/v1/admin/verify:
    post:
      operationId: adminVerify
      summary: Alias for in-memory owner OTP verify
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, code]
              properties:
                email:
                  type: string
                  format: email
                code:
                  type: string
      responses:
        "200":
          description: Owner verified
          content:
            application/json:
              schema:
                type: object
                required: [status, email, key_fingerprint, verified_at]
                properties:
                  status:
                    type: string
                  email:
                    type: string
                  key_fingerprint:
                    type: string
                  verified_at:
                    type: string
                    format: date-time
        "401":
          description: Invalid OTP
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /api/v1/onboard/claim:
    post:
      operationId: onboardClaim
      summary: Claim developer onboarding invite and receive credentials
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [invite_token, desired_uid]
              properties:
                invite_token:
                  type: string
                desired_uid:
                  type: string
                email:
                  type: string
                  format: email
                display_name:
                  type: string
                ssh_public_key:
                  type: string
      responses:
        "200":
          description: Developer account provisioned
          content:
            application/json:
              schema:
                type: object
                required: [status, user, credentials, workspace]
                properties:
                  status:
                    type: string
                  idempotent_replay:
                    type: boolean
                  user:
                    type: object
                  credentials:
                    type: object
                  workspace:
                    type: object
        "400":
          description: Invalid claim request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /api/v1/auth/signup:
    post:
      operationId: authSignup
      summary: Start self-serve sign-up with email
      description: >
        Creates a pending account and sends a sign-up verification code. The
        response is identical for a new and an existing address, so the route
        cannot be used to enumerate accounts. When sign-up is disabled the edge
        answers 404 as if the route did not exist.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  format: password
                  writeOnly: true
                display_name:
                  type: string
                locale:
                  type: string
                  enum: [fa, en]
                org_name:
                  type: string
                  description: When set, the new account owns this organization.
                invite_token:
                  type: string
                  description: >
                    When valid for the same address, joins the inviting
                    organization and skips the OTP.
      responses:
        "202":
          description: Verification sent (same response for new and existing addresses)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignupAccepted"
        "400":
          description: Invalid sign-up request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Sign-up is disabled (the route behaves as if it does not exist)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "429":
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /api/v1/auth/signup/verify:
    post:
      operationId: authSignupVerify
      summary: Verify the sign-up code and activate the account
      description: >
        Consumes the sign-up OTP and the pending password, then returns the same
        token pair shape as the other auth routes. A disabled sign-up surface is
        a 404, exactly like the sign-up route.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, code, password]
              properties:
                email:
                  type: string
                  format: email
                code:
                  type: string
                password:
                  type: string
                  format: password
                  writeOnly: true
      responses:
        "200":
          description: Account activated and tokens issued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenPair"
        "400":
          description: Invalid sign-up verification request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Invalid code or password
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Sign-up is disabled (the route behaves as if it does not exist)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "429":
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /api/v1/orgs:
    get:
      operationId: orgList
      summary: List the caller's organizations
      description: >
        Requires the caller's bearer access token. The gateway forwards it to
        orbit-auth as gRPC authorization metadata and does not verify it
        locally.
      responses:
        "200":
          description: Organizations the caller belongs to
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationList"
        "401":
          description: Missing or invalid access token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Resource not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "429":
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "502":
          description: Upstream orbit-auth failure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
    post:
      operationId: orgCreate
      summary: Create an organization owned by the caller
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                slug:
                  type: string
                  description: >
                    Optional tenant host label. When omitted Orbit Auth derives
                    one from the name, or from the organization id when the name
                    has no usable ASCII.
      responses:
        "200":
          description: Organization created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationEnvelope"
        "400":
          description: Invalid organization name or slug
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Missing or invalid access token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "409":
          description: The organization cannot be created in its current state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "429":
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "502":
          description: Upstream orbit-auth failure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /api/v1/orgs/{org_id}/members:
    get:
      operationId: orgMembersList
      summary: List an organization's members
      description: >
        Requires the caller's bearer access token. A caller who is not an active
        member and an unknown organization both answer 404.
      parameters:
        - name: org_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Organization members
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MembershipList"
        "400":
          description: Invalid organization id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Missing or invalid access token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Organization not found or the caller is not a member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "429":
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "502":
          description: Upstream orbit-auth failure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
    post:
      operationId: orgMemberAdd
      summary: Add an existing user to an organization
      description: >
        Requires the caller's bearer access token. Orbit Auth derives the actor
        from the token and answers 403 unless the caller is an active owner or
        admin. The user joins as a plain member.
      parameters:
        - name: org_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MemberAddBody"
      responses:
        "200":
          description: Member added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberStatusChange"
        "400":
          description: Invalid organization or user id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Missing or invalid access token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Caller is not an organization owner or admin, or may not act on this member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Organization or user not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "409":
          description: User is already a member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "429":
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "502":
          description: Upstream orbit-auth failure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /api/v1/orgs/{org_id}/members/{user_id}:
    delete:
      operationId: orgMemberRemove
      summary: Remove a user from an organization
      description: >
        The caller must be an owner, or an admin removing a plain member, or the
        member themselves. Orbit Auth refuses to remove the last active member
        or the last active owner and answers 409.
      parameters:
        - name: org_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: user_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Member removed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberStatusChange"
        "400":
          description: Invalid organization or user id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Missing or invalid access token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Caller is not an organization owner or admin, or may not act on this member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Organization, user or membership not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "409":
          description: Refused because this is the last active member or the last active owner
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "429":
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "502":
          description: Upstream orbit-auth failure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /api/v1/orgs/{org_id}/members/{user_id}/suspend:
    post:
      operationId: orgMemberSuspend
      summary: Suspend a user's membership
      description: >
        Suspension keeps the membership row and drops the org claim on the next
        token refresh. The caller must be an owner, or an admin suspending a
        plain member. The last active member and the last active owner cannot
        be suspended.
      parameters:
        - name: org_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: user_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Member suspended
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberStatusChange"
        "400":
          description: Invalid organization or user id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Missing or invalid access token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Caller is not an organization owner or admin, or may not act on this member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Organization, user or membership not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "409":
          description: Refused because this is the last active member or the last active owner
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "429":
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "502":
          description: Upstream orbit-auth failure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /api/v1/orgs/{org_id}/members/{user_id}/role:
    put:
      operationId: orgMemberRoleSet
      summary: Change a member's organization administration tier
      description: >
        Sets the member's role to owner, admin or member. Only an owner can
        grant owner or admin; an admin cannot change roles. The last active
        owner cannot be demoted (409). Not a product role.
      parameters:
        - name: org_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: user_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role:
                  type: string
                  enum: [owner, admin, member]
      responses:
        "200":
          description: Role changed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MembershipEnvelope"
        "400":
          description: Invalid organization id, user id or role
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Missing or invalid access token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Caller is not an organization owner, or may not grant this role
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Organization or membership not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "409":
          description: Refused because this is the last active owner
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "429":
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "502":
          description: Upstream orbit-auth failure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /api/v1/orgs/{org_id}/slug:
    put:
      operationId: orgSlugSet
      summary: Change an organization's slug
      description: >
        The slug is the label of the organization's tenant host. Only an owner
        can change it. The old slug stays reserved for the organization and
        keeps resolving to it, so a rename never frees an address for someone
        else.
      parameters:
        - name: org_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [slug]
              properties:
                slug:
                  type: string
      responses:
        "200":
          description: Slug changed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationEnvelope"
        "400":
          description: Invalid or reserved slug
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Missing or invalid access token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Caller is not an organization owner
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Organization not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "409":
          description: The slug is held by another organization or was held by one
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "429":
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "502":
          description: Upstream orbit-auth failure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /api/v1/public/tenants/{slug}:
    get:
      operationId: tenantResolve
      summary: Resolve a tenant host label to its organization
      description: >
        Public and read-only: the web edge calls it before anyone signs in. It
        returns only the organization id, name and current slug, never members.
        A retired slug resolves to the same organization and reports its current
        slug with `retired: true`, so the caller can redirect. An unknown,
        invalid or reserved slug is 404. Answers are cacheable for 30 seconds.
      security: []
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Tenant found
          headers:
            Cache-Control:
              schema:
                type: string
                example: public, max-age=30
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tenant"
        "404":
          description: No organization holds or has held this slug
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "429":
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "502":
          description: Upstream orbit-auth failure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /api/v1/orgs/{org_id}/invites:
    post:
      operationId: orgInviteCreate
      summary: Invite an email address to an organization
      description: >
        Creates or rotates a pending invitation and sends the org_invite email
        through orbit-notifications. The caller must be an active owner or
        admin of the organization; any other member gets 403.
      parameters:
        - name: org_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
      responses:
        "200":
          description: Invitation created or rotated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InviteEnvelope"
        "400":
          description: Invalid organization id or email
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Missing or invalid access token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Caller is not an organization owner or admin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Organization not found or the caller is not a member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "409":
          description: The invitation cannot be created in the current state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "429":
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "502":
          description: Upstream orbit-auth failure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
    get:
      operationId: orgInviteList
      summary: List an organization's invitations
      description: Invitation tokens are never returned.
      parameters:
        - name: org_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Organization invitations
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InviteList"
        "400":
          description: Invalid organization id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Missing or invalid access token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Caller is not an organization owner or admin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Organization not found or the caller is not a member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "429":
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "502":
          description: Upstream orbit-auth failure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /api/v1/orgs/{org_id}/invites/{invite_id}:
    delete:
      operationId: orgInviteRevoke
      summary: Revoke a pending organization invitation
      parameters:
        - name: org_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: invite_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Invitation revoked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RevokeResponse"
        "400":
          description: Invalid organization or invitation id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Missing or invalid access token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Caller is not an organization owner or admin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Organization or invitation not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "429":
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "502":
          description: Upstream orbit-auth failure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /api/v1/invites/accept:
    post:
      operationId: inviteAccept
      summary: Accept an organization invitation
      description: >
        Works for any authenticated user, not only an existing member. The
        account email must match the invitation, which must still be pending and
        unexpired. Every failure is the same generic invalid-invite error.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token:
                  type: string
                  writeOnly: true
      responses:
        "200":
          description: Invitation accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InviteEnvelope"
        "400":
          description: Invalid invitation token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Missing or invalid access token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "429":
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "502":
          description: Upstream orbit-auth failure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /api/v1/session/org:
    post:
      operationId: sessionSelectOrg
      summary: Select the active organization and rotate the session
      description: >
        Rotates the presented refresh token and returns a new access/refresh
        pair carrying the selected organization. The old pair cannot keep
        selecting organizations.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [org_id, refresh_token]
              properties:
                org_id:
                  type: string
                  format: uuid
                refresh_token:
                  type: string
                  writeOnly: true
      responses:
        "200":
          description: New token pair for the selected organization
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenPair"
        "400":
          description: Invalid organization id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Missing or invalid access or refresh token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Organization not found or the caller is not a member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "429":
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "502":
          description: Upstream orbit-auth failure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /api/v1/flags:
    get:
      operationId: flagsList
      summary: Read the platform feature-flag document
      description: >
        Public and unauthenticated so browsers can read flags before sign-in.
        The gateway proxies orbit-auth's GET /v1/flags document and asks clients
        to revalidate via the version field (`Cache-Control: no-cache`).
      security: []
      responses:
        "200":
          description: Flag document
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FlagSet"
        "429":
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "502":
          description: Upstream orbit-auth failure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    TokenPair:
      type: object
      required:
        - access_token
        - refresh_token
        - expires_at
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
        expires_at:
          type: string
          format: date-time
          description: Access token expiry (ISO 8601)
    OtpRequestResponse:
      type: object
      required:
        - expires_at
      properties:
        expires_at:
          type: string
          format: date-time
          description: OTP expiry (ISO 8601)
    ErrorEnvelope:
      type: object
      required:
        - error
      properties:
        error:
          type: string
    SignupAccepted:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum: [verification_sent]
    Organization:
      type: object
      required:
        - id
        - name
        - slug
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
          description: >
            Current tenant host label: 3 to 30 lowercase letters, digits and
            single hyphens, unique across organizations and across time.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    OrganizationEnvelope:
      type: object
      required:
        - organization
      properties:
        organization:
          $ref: "#/components/schemas/Organization"
    OrganizationList:
      type: object
      required:
        - organizations
      properties:
        organizations:
          type: array
          items:
            $ref: "#/components/schemas/Organization"
    Membership:
      type: object
      required:
        - org_id
        - user_id
        - status
        - role
        - created_at
        - updated_at
      properties:
        org_id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        status:
          type: string
          description: active or suspended
        role:
          type: string
          enum: [owner, admin, member]
          description: Organization administration tier, not a product role
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    Tenant:
      type: object
      required:
        - org_id
        - slug
        - name
        - retired
      properties:
        org_id:
          type: string
          format: uuid
        slug:
          type: string
          description: The organization's current slug
        name:
          type: string
        retired:
          type: boolean
          description: True when the requested slug is no longer the current one
    MembershipEnvelope:
      type: object
      required:
        - membership
      properties:
        membership:
          $ref: "#/components/schemas/Membership"
    MembershipList:
      type: object
      required:
        - members
      properties:
        members:
          type: array
          items:
            $ref: "#/components/schemas/Membership"
    MemberAddBody:
      type: object
      required:
        - user_id
      properties:
        user_id:
          type: string
          format: uuid
    Invite:
      type: object
      required:
        - id
        - org_id
        - email
        - inviter_id
        - status
        - expires_at
        - created_at
      properties:
        id:
          type: string
          format: uuid
        org_id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        inviter_id:
          type: string
          format: uuid
        status:
          type: string
          description: pending, accepted or revoked
        expires_at:
          type: string
          format: date-time
        accepted_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
    InviteEnvelope:
      type: object
      required:
        - invite
      properties:
        invite:
          $ref: "#/components/schemas/Invite"
    InviteList:
      type: object
      required:
        - invites
      properties:
        invites:
          type: array
          items:
            $ref: "#/components/schemas/Invite"
    RevokeResponse:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum: [revoked]
    MemberStatusChange:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum: [added, removed, suspended]
    FeatureFlag:
      type: object
      required:
        - name
        - enabled
        - description
      properties:
        name:
          type: string
        enabled:
          type: boolean
        description:
          type: string
    FlagSet:
      type: object
      required:
        - version
        - flags
      properties:
        version:
          type: string
          description: Opaque document version a client can cache against.
        flags:
          type: array
          items:
            $ref: "#/components/schemas/FeatureFlag"
