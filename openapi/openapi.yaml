          description: Staff service unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    staffBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Staff access token, in one of two forms:

        - An RS256 access token from the Keycloak staff realm, verified against
          its JWKS. The issuer and audience must match the gateway's staff OIDC
          configuration, and the token must carry a staff group in `groups`.
          Staff identity is `keycloak:` plus the token `sub`.
        - A legacy HS256 staff token. It is accepted only while
          `STAFF_HS256_ENABLED` is not `false`.

        The break-glass reason and the target organization of a Keycloak staff
        request come from the `X-Staff-Reason` and `X-Staff-Target-Org` headers,
        never from token claims.
    staffKeycloakBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Keycloak staff access token only: RS256, verified against the staff JWKS,
        with the gateway's staff issuer and audience and a staff group in `groups`.
        Legacy HS256 staff tokens are refused on these routes, whatever
        `STAFF_HS256_ENABLED` says. Staff identity is `keycloak:` plus the token `sub`.
        The staff reason is taken from the request body, never from a header.
  parameters:
    StaffReason:
      name: X-Staff-Reason
      in: header
      required: false
      description: |
        Audited reason for a staff request. Required and non-empty for every
        request that is not GET or HEAD; otherwise the gateway answers 400
        `staff reason required`.
      schema:
        type: string
        minLength: 1
    StaffTargetOrg:
      name: X-Staff-Target-Org
      in: header
      required: false
      description: |
        Tenant organization a Keycloak staff request acts on. A non-empty value
        marks the request as break-glass access.
      schema:
        type: string
  schemas:
    StaffOrganization:
      type: object
      required: [id, name, slug, status, created_at, member_count, owner_user_ids]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
        status:
          type: string
          enum: [active, suspended]
        created_at:
          type: string
          format: date-time
        member_count:
          type: integer
          description: Counts every membership, whatever its lifecycle status.
        owner_user_ids:
          type: array
          items:
            type: string
          description: Owners whose membership is active.
    StaffInvite:
      type: object
      required: [id, role, expires_at]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          description: Present only for an email invitation.
        phone:
          type: string
          description: Present only for a phone invitation, in E.164 form.
        role:
          type: string
          enum: [owner, admin, member]
        expires_at:
          type: string
          format: date-time
    StaffMember:
      type: object
      required: [user_id, role, status, joined_at]
      properties:
        user_id:
          type: string
          format: uuid
        role:
          type: string
          enum: [owner, admin, member]
        status:
          type: string
          enum: [active, invited, suspended]
        joined_at:
          type: string
          format: date-time
    StaffOrgDetail:
      type: object
      required: [organization, members, pending_invites]
      properties:
        organization:
          $ref: "#/components/schemas/StaffOrganization"
        members:
          type: array
          items:
            $ref: "#/components/schemas/StaffMember"
        pending_invites:
          type: array
          items:
            $ref: "#/components/schemas/StaffInvite"
    StaffProvisionRequest:
      type: object
      required: [name, idempotency_key, reason]
      oneOf:
        - required: [owner_email]
        - required: [owner_phone]
      properties:
        name:
          type: string
        slug:
          type: string
          description: Optional. Empty derives the slug from the name.
        owner_email:
          type: string
          format: email
          description: Set this or `owner_phone`, not both.
        owner_phone:
          type: string
          description: E.164 phone number. Set this or `owner_email`, not both.
        idempotency_key:
          type: string
          minLength: 1
          maxLength: 128
        accept_url:
          type: string
          maxLength: 500
          description: >
            Optional https URL of the product's acceptance page. `{slug}` is replaced
            with the organization's current slug. orbit-auth checks the host against its
            allowed list; an invalid or not-allowed URL is 400 `invalid accept_url`.
        reason:
          type: string
          minLength: 1
          maxLength: 500
          description: Audited reason, trimmed. Required.
    StaffProvisioned:
      type: object
      required: [organization, owner_invite]
      properties:
        organization:
          $ref: "#/components/schemas/StaffOrganization"
        owner_invite:
          $ref: "#/components/schemas/StaffInvite"
        token:
          type: string
          description: >
            The raw owner token. Returned only for a phone owner, and only by this
            response; it is never returned again.
    StaffOwnerInviteRequest:
      type: object
      required: [reason]
      oneOf:
        - required: [owner_email]
        - required: [owner_phone]
      properties:
        owner_email:
          type: string
          format: email
        owner_phone:
          type: string
        accept_url:
          type: string
          maxLength: 500
          description: >
            Optional https URL of the product's acceptance page. `{slug}` is replaced
            with the organization's current slug. orbit-auth checks the host against its
            allowed list; an invalid or not-allowed URL is 400 `invalid accept_url`.
        reason:
          type: string
          minLength: 1
          maxLength: 500
          description: Audited reason, trimmed. Required.
    StaffOwnerInviteCreated:
      type: object
      required: [invite]
      properties:
        invite:
          $ref: "#/components/schemas/StaffInvite"
        token:
          type: string
          description: >
            The raw owner token. Returned only for a phone owner, and only by this
            response; it is never returned again.
    StaffUser:
      type: object
      required: [id, status, email_verified, mobile_verified, has_password, google_linked, created_at, membership_count]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        mobile:
          type: string
        username:
          type: string
        display_name:
          type: string
        status:
          type: string
          enum: [active, disabled, signup_pending]
        email_verified:
          type: boolean
        mobile_verified:
          type: boolean
        has_password:
          type: boolean
        google_linked:
          type: boolean
        created_at:
          type: string
          format: date-time
        last_login_at:
          type: string
          format: date-time
          description: Omitted when the account never signed in.
        disabled_at:
          type: string
          format: date-time
          description: Omitted unless the account is disabled.
        disabled_reason:
          type: string
        membership_count:
          type: integer
    StaffUserMembership:
      type: object
      required: [org_id, org_name, org_slug, org_status, role, status, joined_at]
      properties:
        org_id:
          type: string
          format: uuid
        org_name:
          type: string
        org_slug:
          type: string
        org_status:
          type: string
          enum: [active, suspended]
        role:
          type: string
          enum: [owner, admin, member]
        status:
          type: string
          enum: [active, invited, suspended]
        joined_at:
          type: string
          format: date-time
    StaffUserDetail:
      type: object
      required: [user, memberships]
      properties:
        user:
          $ref: "#/components/schemas/StaffUser"
        memberships:
          type: array
          items:
            $ref: "#/components/schemas/StaffUserMembership"
    StaffUserPage:
      type: object
      required: [users, next_page_token]
      properties:
        users:
          type: array
          items:
            $ref: "#/components/schemas/StaffUser"
        next_page_token:
          type: string
          description: Empty on the last page.
    StaffUserReasonRequest:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 500
          description: Audited reason, trimmed. Required.
    StaffAuditEvent:
      type: object
      required: [id, occurred_at, action, actor_kind, details]
      properties:
        id:
          type: integer
          format: int64
        occurred_at:
          type: string
          format: date-time
        action:
          type: string
        actor_kind:
          type: string
          enum: [user, staff, system]
        actor_id:
          type: string
          description: The user id for a user actor, the staff subject for a staff actor; omitted for a system actor.
        org_id:
          type: string
          format: uuid
        subject_user_id:
          type: string
          format: uuid
        invite_id:
          type: string
        reason:
          type: string
        details:
          type: object
          description: A JSON object. Never holds an email address, a mobile number, a password, a token or a hash.
    StaffAuditEventPage:
      type: object
      required: [events, next_page_token]
      properties:
        events:
          type: array
          items:
            $ref: "#/components/schemas/StaffAuditEvent"
        next_page_token:
          type: string
          description: Empty on the last page.
    TokenPair:
      type: object
      required:
        - access_token
        - refresh_token
        - expires_at
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
        expires_at:
          type: string
          format: date-time
          description: Access token expiry (ISO 8601)
    OtpRequestResponse:
      type: object
      required:
        - expires_at
      properties:
        expires_at:
          type: string
          format: date-time
          description: OTP expiry (ISO 8601)
    ErrorEnvelope:
      type: object
      required:
        - error
      properties:
        error:
          type: string
        code:
          type: string
          description: Stable machine-readable reason, present only on refusals that carry one.
    SignupAccepted:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum: [verification_sent]
    Organization:
      type: object
      required:
        - id
        - name
        - slug
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
          description: >
            Current tenant host label: 3 to 30 lowercase letters, digits and
            single hyphens, unique across organizations and across time.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    OrganizationEnvelope:
      type: object
      required:
        - organization
      properties:
        organization:
          $ref: "#/components/schemas/Organization"
    OrganizationList:
      type: object
      required:
        - organizations
      properties:
        organizations:
          type: array
          items:
            $ref: "#/components/schemas/Organization"
    Membership:
      type: object
      required:
        - org_id
        - user_id
        - status
        - role
        - created_at
        - updated_at
      properties:
        org_id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        status:
          type: string
          description: active or suspended
        role:
          type: string
          enum: [owner, admin, member]
          description: Organization administration tier, not a product role
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    Tenant:
      type: object
      required:
        - org_id
        - slug
        - name
        - retired
      properties:
        org_id:
          type: string
          format: uuid
        slug:
          type: string
          description: The organization's current slug
        name:
          type: string
        retired:
          type: boolean
          description: True when the requested slug is no longer the current one
    MembershipEnvelope:
      type: object
      required:
        - membership
      properties:
        membership:
          $ref: "#/components/schemas/Membership"
    MembershipList:
      type: object
      required:
        - members
      properties:
        members:
          type: array
          items:
            $ref: "#/components/schemas/Membership"
    MemberAddBody:
      type: object
      required:
        - user_id
      properties:
        user_id:
          type: string
          format: uuid
    Invite:
      type: object
      required:
        - id
        - org_id
        - email
        - inviter_id
        - status
        - expires_at
        - created_at
      properties:
        id:
          type: string
          format: uuid
        org_id:
          type: string
          format: uuid
        email:
          type: string
          description: Recipient email address. Empty for a phone invitation.
        phone:
          type: string
          description: Recipient phone number in E.164 form. Present only for a phone invitation.
        role:
          type: string
          enum: [owner, admin, member]
          description: Organization tier the invitee receives. Omitted when unknown.
        inviter_id:
          type: string
          format: uuid
        status:
          type: string
          description: pending, accepted or revoked
        expires_at:
          type: string
          format: date-time
        accepted_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
    InviteEnvelope:
      type: object
      required:
        - invite
      properties:
        invite:
          $ref: "#/components/schemas/Invite"
    InviteCreated:
      type: object
      required:
        - invite
      properties:
        invite:
          $ref: "#/components/schemas/Invite"
        token:
          type: string
          description: >
            The raw invitation token. Returned only for a phone invitation, and only
            by this response, so share it with the invitee now; it is never returned
            again.
    InvitePreviewRequest:
      type: object
      required:
        - token
      properties:
        token:
          type: string
          format: password
          writeOnly: true
          description: Bearer secret, never log.
    InviteSignupRequest:
      type: object
      required:
        - token
        - password
      properties:
        token:
          type: string
          format: password
          writeOnly: true
          description: Bearer secret, never log.
        password:
          type: string
          format: password
          writeOnly: true
          minLength: 8
          description: At least 8 characters. A shorter password is 400.
        display_name:
          type: string
        phone_code:
          type: string
          writeOnly: true
          description: The one-time code POST /api/v1/public/invites/phone-code sent to the invited number. Required for a phone invitation, ignored for an email invitation. Never log.
    InvitePhoneCodeRequest:
      type: object
      required:
        - token
      properties:
        token:
          type: string
          format: password
          writeOnly: true
          description: Bearer secret, never log.
    InvitePhoneCodeSent:
      type: object
      required:
        - expires_at
      properties:
        expires_at:
          type: string
          format: date-time
          description: When the code stops being valid.
    InvitePreview:
      type: object
      required:
        - org_id
        - org_name
        - org_slug
        - role
        - expires_at
        - channel
        - account_exists
      properties:
        org_id:
          type: string
          format: uuid
        org_name:
          type: string
        org_slug:
          type: string
        role:
          type: string
          enum: [owner, admin, member]
        expires_at:
          type: string
          format: date-time
        channel:
          type: string
          enum: [email, phone]
          description: How the invitation was delivered.
        account_exists:
          type: boolean
          description: True when an active account already uses the invited phone number or email. Never says whose account it is.
    InviteSignupAccepted:
      type: object
      required:
        - user_id
        - org_id
        - invite_id
        - role
        - identifier
      properties:
        user_id:
          type: string
          format: uuid
        org_id:
          type: string
          format: uuid
        invite_id:
          type: string
          format: uuid
        role:
          type: string
          enum: [owner, admin, member]
        identifier:
          type: string
          description: What the new account signs in with, its phone number in E.164 form or its email address.
    InviteList:
      type: object
      required:
        - invites
      properties:
        invites:
          type: array
          items:
            $ref: "#/components/schemas/Invite"
    RevokeResponse:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum: [revoked]
    MemberStatusChange:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum: [added, removed, suspended, reactivated]
    FeatureFlag:
      type: object
      required:
        - name
        - enabled
        - description
      properties:
        name:
          type: string
        enabled:
          type: boolean
        description:
          type: string
    FlagSet:
      type: object
      required:
        - version
        - flags
      properties:
        version:
          type: string
          description: Opaque document version a client can cache against.
        flags:
          type: array
          items:
            $ref: "#/components/schemas/FeatureFlag"
    GoogleSignInStarted:
      type: object
      required:
        - authorization_url
        - state
      properties:
        authorization_url:
          type: string
          description: Send the browser here.
        state:
          type: string
          description: Single-use state, valid for ten minutes. Send it back to the complete route.
    GoogleSignInTokens:
      allOf:
        - $ref: "#/components/schemas/TokenPair"
        - type: object
          required:
            - return_to
          properties:
            return_to:
              type: string
              description: The return path given at start, "/" when it was empty.
            invite_id:
              type: string
              description: The invitation the sign-in accepted. Present only for an invitation.
            org_id:
              type: string
              description: The invitation's organization. Present only for an invitation.
            org_slug:
              type: string
              description: The organization slug. Omitted when empty.
            role:
              type: string
              description: The role granted by the invitation. Omitted when empty.
            already_member:
              type: boolean
              description: Whether the account was already a member. Present only for an invitation.
    SignInMethods:
      type: object
      required:
        - has_password
        - google
        - email_verified
        - mobile_verified
      properties:
        has_password:
          type: boolean
        google:
          type: array
          items:
            $ref: "#/components/schemas/SignInMethodGoogle"
        username:
          type: [string, "null"]
        email:
          type: [string, "null"]
        email_verified:
          type: boolean
        mobile:
          type: [string, "null"]
        mobile_verified:
          type: boolean
    SignInMethodGoogle:
      type: object
      required:
        - email
      properties:
        email:
          type: string
        linked_at:
          type: [string, "null"]
          format: date-time
        last_login_at:
          type: [string, "null"]
          format: date-time
    GoogleLinked:
      type: object
      required:
        - email
        - return_to
      properties:
        email:
          type: string
        return_to:
          type: string
    SessionUsername:
      type: object
      required:
        - username
      properties:
        username:
          type: string
          description: The stored form, trimmed and lower case.
