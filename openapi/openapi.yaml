  /api/v1/public/invites/preview:
    post:
      operationId: invitePreview
      summary: Preview an invitation before signing in
      description: >
        Public: the invitee has no session yet when they open the invitation link.
        The token travels in the JSON body, never in the URL. The answer shows the
        organization, its tier and the expiry, and never the recipient's email
        address or phone number. An unknown, expired or no longer pending token gets
        the same 404. The token is a bearer secret, so the answer is never cached.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvitePreviewRequest"
      responses:
        "200":
          description: Invitation found and pending
          headers:
            Cache-Control:
              schema:
                type: string
                example: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvitePreview"
        "400":
          description: Invalid JSON, or the token is missing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Invitation not found, expired or no longer pending
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "429":
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "502":
          description: Upstream orbit-auth failure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /api/v1/public/invites/accept:
    post:
      operationId: inviteAcceptSignup
      summary: Accept a phone invitation by creating the account
      description: >
        Public. The token travels in the JSON body, never in the URL. Creates the
        account for an email or a phone invitation, sets its password and display name,
        and joins the organization with the invited tier. An email invitation verifies
        the new account's email, since the token reached only that mailbox; a phone
        invitation's number is the invited number and is not verified. If an account
        already uses the invited number or email the answer is 409 `account_exists`: that
        person signs in and accepts with POST /api/v1/invites/accept instead.
        A phone invitation also needs `phone_code`, the one-time code
        POST /api/v1/public/invites/phone-code sent to the invited number.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InviteSignupRequest"
      responses:
        "201":
          description: Account created and organization joined
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InviteSignupAccepted"
        "400":
          description: Invalid JSON, the token or password is missing, the password is shorter than 8 characters, or a phone invitation has no phone_code, or its phone_code is wrong, expired or used
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Invite sign-up is disabled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Invitation not found, expired or no longer pending
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "409":
          description: An account already uses the invited number; the person signs in and calls POST /api/v1/invites/accept
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "429":
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "502":
          description: Upstream orbit-auth failure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /api/v1/public/invites/phone-code:
    post:
      operationId: invitePhoneCodeRequest
      summary: Send the one-time code a phone invitation needs before sign-up
      description: >
        Public. The token travels in the JSON body, never in the URL. Sends a
        one-time code by SMS to the number of a phone invitation; the code is the
        `phone_code` that POST /api/v1/public/invites/accept requires. A new code is
        refused with 429 until 60 seconds after the last one, and also while the
        newest code has a failed guess and has not yet expired. The answer carries
        only the expiry, never the code or the number. Per-IP budget 5 a minute.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvitePhoneCodeRequest"
      responses:
        "200":
          description: Code sent
          headers:
            Cache-Control:
              schema:
                type: string
                example: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvitePhoneCodeSent"
        "400":
          description: Invalid JSON, or the token is missing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Invitation not found, expired or no longer pending, or it is an email invitation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "409":
          description: An account already uses the invited number; the person signs in and calls POST /api/v1/invites/accept
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "429":
          description: A code was sent recently, or the newest code has a failed guess and has not expired; wait before requesting another code
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "502":
          description: Upstream orbit-auth failure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "503":
          description: Phone codes are not available on this deployment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /api/v1/orgs/{org_id}/invites:
    post:
      operationId: orgInviteCreate
      summary: Invite an email address or a phone number to an organization
      description: >
        Creates or rotates a pending invitation. Exactly one of `email` and
        `phone` is required. An email invitation sends the org_invite email
        through orbit-notifications. A phone invitation sends nothing yet: the
        response carries the raw invitation `token` once, for the inviter to share
        with the invitee. `role` is the tier the invitee receives and defaults to
        `member`. The caller must be an active owner or admin of the organization;
        any other member gets 403.
      parameters:
        - name: org_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              oneOf:
                - required: [email]
                - required: [phone]
              properties:
                email:
                  type: string
                  format: email
                  description: Recipient email address. Set this or `phone`, not both.
                phone:
                  type: string
                  description: Recipient phone number in E.164 form. Set this or `email`, not both.
                role:
                  type: string
                  enum: [owner, admin, member]
                  default: member
                  description: Only an owner can grant owner or admin.
                accept_url:
                  type: string
                  maxLength: 500
                  description: >
                    Optional https URL of the product's acceptance page. `{slug}` is replaced
                    with the organization's current slug. orbit-auth checks the host against its
                    allowed list; an invalid or not-allowed URL is 400 `invalid accept_url`.
      responses:
        "200":
          description: Invitation created or rotated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InviteCreated"
        "400":
          description: Invalid organization id, not exactly one of email and phone, or an invalid role
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Missing or invalid access token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Caller is not an organization owner or admin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Organization not found or the caller is not a member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "409":
          description: The invitation cannot be created in the current state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "429":
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "502":
          description: Upstream orbit-auth failure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
    get:
