openapi: 3.1.0
info:
  title: Orbit API Gateway
  version: 0.1.0
  description: |
    REST edge for Orbit Auth, organizations and invitations.

    Membership and invitation writes are authorized by Orbit Auth, not here.
    Every membership has an administration tier (owner, admin or member). The
    caller must be an active owner or admin; an admin can change only plain
    members; only an owner can grant owner or admin; any member can remove
    themselves. A caller without that authority gets 403, and the last active
    owner can never be removed, suspended or demoted (409). The tier is not a
    product role: products keep their own roles and permissions.
servers:
  - url: /
security:
  - bearerAuth: []
paths:
  /api/v1/auth/login:
    post:
      operationId: authLogin
      summary: Login with username, mobile number or email address and password
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              oneOf:
                - required: [identifier]
                - required: [email]
              properties:
                identifier:
                  type: string
                  description: Username, E.164 mobile number (for example +989121234567) or email address.
                email:
                  type: string
                  format: email
                  deprecated: true
                  description: Deprecated alias for identifier.
                password:
                  type: string
                  format: password
                  writeOnly: true
      responses:
        "200":
          description: Tokens issued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenPair"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "429":
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /api/v1/auth/otp/request:
    post:
      operationId: authOtpRequest
      summary: Request OTP
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [channel]
              properties:
                identifier:
                  type: string
                  description: Canonical identity (preferred). Falls back to email when empty.
                email:
                  type: string
                  format: email
                  description: Legacy alias used when identifier is omitted.
                channel:
                  type: string
                  enum: [email, sms]
                correlation_id:
                  type: string
      responses:
        "200":
          description: OTP dispatched
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OtpRequestResponse"
        "429":
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /api/v1/auth/otp/verify:
    post:
      operationId: authOtpVerify
      summary: Verify OTP
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [channel, code]
              properties:
                identifier:
                  type: string
                  description: Canonical identity (preferred). Falls back to email when empty.
                email:
                  type: string
                  format: email
                  description: Legacy alias used when identifier is omitted.
                channel:
                  type: string
                  enum: [email, sms]
                code:
                  type: string
      responses:
        "200":
          description: Tokens issued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenPair"
        "401":
          description: Invalid OTP
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "429":
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /api/v1/auth/token/refresh:
    post:
      operationId: authTokenRefresh
      summary: Refresh access token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token:
                  type: string
                  writeOnly: true
      responses:
        "200":
          description: Tokens issued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenPair"
        "401":
          description: Invalid refresh token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /api/v1/auth/token/revoke:
    post:
      operationId: authTokenRevoke
      summary: Revoke refresh token
      description: >
        Idempotent. Unknown, revoked, expired or empty refresh tokens also return 204,
        so the response never reveals whether a token was valid.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token:
                  type: string
                  writeOnly: true
      responses:
        "204":
          description: Token revoked, or already unknown, revoked or expired
        "400":
          description: Malformed JSON body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "429":
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          description: Upstream store failure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /api/v1/system/ownership/challenge:
    post:
      operationId: systemOwnershipChallenge
      summary: Initiate in-memory platform owner OTP (no email)
      description: >
        Stores a 6-digit code in gateway process memory for 10 minutes.
        Does not send SMTP or notification email. Status is `challenge_dispatched`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
                display_name:
                  type: string
      responses:
        "200":
          description: OTP challenge dispatched
          content:
            application/json:
              schema:
                type: object
                required: [status, expires_in]
                properties:
                  status:
                    type: string
                  expires_in:
                    type: string
        "429":
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /api/v1/system/ownership/verify:
    post:
      operationId: systemOwnershipVerify
      summary: Verify in-memory owner OTP
      description: >
        Checks the in-memory challenge. Does not persist an owner vault.
        `key_fingerprint` is a hash of email, code, and timestamp — not a signing secret.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, code]
              properties:
                email:
                  type: string
                  format: email
                code:
                  type: string
      responses:
        "200":
          description: Owner verified
          content:
            application/json:
              schema:
                type: object
                required: [status, email, key_fingerprint, verified_at]
                properties:
                  status:
                    type: string
                  email:
                    type: string
                  key_fingerprint:
                    type: string
                  verified_at:
                    type: string
                    format: date-time
        "401":
          description: Invalid OTP
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /api/v1/dev/onboard/claim:
    post:
      operationId: devOnboardClaim
      summary: Claim developer onboarding invite and receive credentials (Canonical)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [invite_token, desired_uid]
              properties:
                invite_token:
                  type: string
                desired_uid:
                  type: string
                email:
                  type: string
                  format: email
                display_name:
                  type: string
                ssh_public_key:
                  type: string
      responses:
        "200":
          description: Developer account provisioned
          content:
            application/json:
              schema:
                type: object
                required: [status, user, credentials, workspace]
                properties:
                  status:
                    type: string
                  idempotent_replay:
                    type: boolean
                  user:
                    type: object
                  credentials:
                    type: object
                  workspace:
                    type: object
        "400":
          description: Invalid claim request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /api/v1/admin/challenge:
    post:
      operationId: adminChallenge
      summary: Alias for in-memory owner OTP (no email)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
                display_name:
                  type: string
      responses:
        "200":
          description: OTP challenge dispatched
          content:
            application/json:
              schema:
                type: object
                required: [status, expires_in]
                properties:
                  status:
                    type: string
                  expires_in:
                    type: string
        "429":
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /api/v1/admin/verify:
    post:
      operationId: adminVerify
      summary: Alias for in-memory owner OTP verify
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, code]
              properties:
                email:
                  type: string
                  format: email
                code:
                  type: string
      responses:
        "200":
          description: Owner verified
          content:
            application/json:
              schema:
                type: object
                required: [status, email, key_fingerprint, verified_at]
                properties:
                  status:
                    type: string
                  email:
                    type: string
                  key_fingerprint:
                    type: string
                  verified_at:
                    type: string
                    format: date-time
        "401":
          description: Invalid OTP
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /api/v1/onboard/claim:
    post:
      operationId: onboardClaim
      summary: Claim developer onboarding invite and receive credentials
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [invite_token, desired_uid]
              properties:
                invite_token:
                  type: string
                desired_uid:
                  type: string
                email:
                  type: string
                  format: email
                display_name:
                  type: string
                ssh_public_key:
                  type: string
      responses:
        "200":
          description: Developer account provisioned
          content:
            application/json:
              schema:
                type: object
                required: [status, user, credentials, workspace]
                properties:
                  status:
                    type: string
                  idempotent_replay:
                    type: boolean
                  user:
                    type: object
                  credentials:
                    type: object
                  workspace:
                    type: object
        "400":
          description: Invalid claim request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /api/v1/auth/signup:
    post:
      operationId: authSignup
      summary: Start self-serve sign-up with email
      description: >
        Creates a pending account and sends a sign-up verification code. The
        response is identical for a new and an existing address, so the route
        cannot be used to enumerate accounts. When sign-up is disabled the edge
        answers 404 as if the route did not exist.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  format: password
                  writeOnly: true
                display_name:
                  type: string
                locale:
                  type: string
                  enum: [fa, en]
                org_name:
                  type: string
                  description: When set, the new account owns this organization.
                invite_token:
                  type: string
                  description: >
                    When valid for the same address, joins the inviting
                    organization and skips the OTP.
      responses:
        "202":
          description: Verification sent (same response for new and existing addresses)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignupAccepted"
        "400":
          description: Invalid sign-up request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Sign-up is disabled (the route behaves as if it does not exist)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "429":
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /api/v1/auth/signup/verify:
    post:
      operationId: authSignupVerify
      summary: Verify the sign-up code and activate the account
      description: >
        Consumes the sign-up OTP and the pending password, then returns the same
        token pair shape as the other auth routes. A disabled sign-up surface is
        a 404, exactly like the sign-up route.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, code, password]
              properties:
                email:
                  type: string
                  format: email
                code:
                  type: string
                password:
                  type: string
                  format: password
                  writeOnly: true
      responses:
        "200":
          description: Account activated and tokens issued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenPair"
        "400":
          description: Invalid sign-up verification request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Invalid code or password
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Sign-up is disabled (the route behaves as if it does not exist)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "429":
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /api/v1/auth/google/start:
    post:
      operationId: authGoogleStart
      summary: Start a Google sign-in
      description: >
        Returns the Google authorization URL to send the browser to, and the
        single-use state. The caller keeps the state and sends it back with the
        authorization code to `/api/v1/auth/google/complete`; the state is valid
        for ten minutes. The answer is never cacheable. When Google sign-in is
        off the edge answers 404 as if the route did not exist.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                redirect_uri:
                  type: string
                  description: Must equal one of the redirect URIs orbit-auth is configured with.
                return_to:
                  type: string
                  description: A path on the product's origin. Empty means "/".
                invite_token:
                  type: string
                  writeOnly: true
                  description: Optional invitation token. Trimmed; over 512 bytes is 400 `invite_invalid`. Never logged.
      responses:
        "200":
          description: Authorization URL and state issued
          headers:
            Cache-Control:
              schema:
                type: string
                example: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GoogleSignInStarted"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Google sign-in is off (the route behaves as if it does not exist)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "429":
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "412":
          description: The invitation needs a password sign-in (`invite_needs_password`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "502":
          description: Upstream orbit-auth failure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /api/v1/auth/google/complete:
    post:
      operationId: authGoogleComplete
      summary: Complete a Google sign-in and issue tokens
      description: >
        Exchanges the state from `/api/v1/auth/google/start` and the code Google
        returned to the redirect URI for a token pair. It returns the same token
        fields as the other auth routes, plus `return_to`. The answer is never
        cacheable. When Google sign-in is off the edge answers 404.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [state, code]
              properties:
                state:
                  type: string
                  writeOnly: true
                code:
                  type: string
                  writeOnly: true
      responses:
        "200":
          description: Tokens issued
          headers:
            Cache-Control:
              schema:
                type: string
                example: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GoogleSignInTokens"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Google sign-in failed (unknown, used or expired state, or a refused code)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Account not allowed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Google sign-in is off (the route behaves as if it does not exist)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "429":
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "409":
          description: The email does not match the invitation (`google_email_mismatch`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "412":
          description: Sign-up is disabled for the invitation (`sign_up_disabled`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "502":
          description: Upstream orbit-auth failure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /api/v1/orgs:
    get:
      operationId: orgList
      summary: List the caller's organizations
      description: >
        Requires the caller's bearer access token. The gateway forwards it to
        orbit-auth as gRPC authorization metadata and does not verify it
        locally.
      responses:
        "200":
          description: Organizations the caller belongs to
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationList"
        "401":
          description: Missing or invalid access token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Resource not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "429":
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "502":
          description: Upstream orbit-auth failure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
    post:
      operationId: orgCreate
      summary: Create an organization owned by the caller
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                slug:
                  type: string
                  description: >
                    Optional tenant host label. When omitted Orbit Auth derives
                    one from the name, or from the organization id when the name
                    has no usable ASCII.
      responses:
        "200":
          description: Organization created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationEnvelope"
        "400":
          description: Invalid organization name or slug
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Missing or invalid access token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "409":
          description: The organization cannot be created in its current state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "429":
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "502":
          description: Upstream orbit-auth failure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /api/v1/orgs/{org_id}/members:
    get:
      operationId: orgMembersList
      summary: List an organization's members
      description: >
        Requires the caller's bearer access token. A caller who is not an active
        member and an unknown organization both answer 404.
      parameters:
        - name: org_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Organization members
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MembershipList"
        "400":
          description: Invalid organization id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Missing or invalid access token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Organization not found or the caller is not a member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "429":
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "502":
          description: Upstream orbit-auth failure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
    post:
      operationId: orgMemberAdd
      summary: Add an existing user to an organization
      description: >
        Requires the caller's bearer access token. Orbit Auth derives the actor
        from the token and answers 403 unless the caller is an active owner or
        admin. The user joins as a plain member.
      parameters:
        - name: org_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MemberAddBody"
      responses:
        "200":
          description: Member added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberStatusChange"
        "400":
          description: Invalid organization or user id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Missing or invalid access token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Caller is not an organization owner or admin, or may not act on this member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Organization or user not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "409":
          description: User is already a member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "429":
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "502":
          description: Upstream orbit-auth failure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /api/v1/orgs/{org_id}/members/{user_id}:
    delete:
      operationId: orgMemberRemove
      summary: Remove a user from an organization
      description: >
        The caller must be an owner, or an admin removing a plain member, or the
        member themselves. Orbit Auth refuses to remove the last active member
        or the last active owner and answers 409.
      parameters:
        - name: org_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: user_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Member removed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberStatusChange"
        "400":
          description: Invalid organization or user id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Missing or invalid access token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Caller is not an organization owner or admin, or may not act on this member
