                $ref: "#/components/schemas/ErrorEnvelope"
  /api/v1/staff/orgs:
    post:
      operationId: staffOrgProvision
      summary: Provision an organization with one pending owner invitation
      description: >
        Staff only. Creates an organization with no members and one pending owner
        invitation, in one transaction. A repeated `idempotency_key` with the same
        name and owner returns the same organization and rotates the owner
        invitation; a repeat with another name or owner is 409. `reason` is recorded
        with the change. The raw `token` is returned only for a phone owner, once.
      security:
        - staffKeycloakBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StaffProvisionRequest"
      responses:
        "201":
          description: Organization provisioned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffProvisioned"
        "400":
          description: Invalid JSON, missing or too long `reason` or `idempotency_key`, or not exactly one of `owner_email` and `owner_phone`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Missing or invalid staff token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Not a Keycloak staff token with an allowed group
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "409":
          description: Idempotency key reused with another name or owner, or the slug is taken
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "429":
          description: Staff rate limit exceeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "502":
          description: Upstream orbit-auth failure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "503":
